<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HONK'D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bitter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --denim:#16233a;
  --denim-2:#0e1826;
  --cream:#f4e9d8;
  --turquoise:#2ea8a0;
  --orange:#d9622b;
  --gold:#c9a13b;
  --silver:#9fb0c2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  background:
    radial-gradient(circle at 50% -10%, rgba(46,168,160,0.10), transparent 55%),
    var(--denim);
  color:var(--cream);
  font-family:'Bitter', Georgia, serif;
  min-height:100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
.mono{ font-family:'JetBrains Mono', monospace; }
.title-block{
  font-family:'Oswald', sans-serif;
  text-transform:uppercase;
  letter-spacing:0.03em;
  line-height:1.15;
  font-weight:700;
  color:var(--turquoise);
}
.wrap{ max-width:480px; margin:0 auto; padding:28px 18px 40px; min-height:100vh; display:flex; flex-direction:column;}
.center-flex{ flex:1; display:flex; flex-direction:column; justify-content:center; }

/* --- top brand --- */
.brand{ text-align:center; margin-bottom:22px; }
.brand h1{ font-size:clamp(28px, 8vw, 40px); margin:0 0 4px; }
.brand p{ margin:0; opacity:0.75; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--silver); font-family:'Oswald',sans-serif; }
.mascot-perch{ display:flex; justify-content:center; margin-bottom:6px; }
.goose-lg{ width:78px; height:78px; }
.goose-sm{ width:50px; height:50px; }
.stamp{ position:absolute; top:52px; right:16px; width:46px; height:46px; transform:rotate(-9deg); opacity:0.85; }
.qr-wrap{ background:var(--cream); border-radius:10px; padding:14px; width:150px; height:150px; margin:0 auto; }
.qr-wrap svg{ display:block; }
.qr-caption{ text-align:center; font-size:12px; opacity:0.65; margin-top:8px; }
.qr-caption b{ color:var(--turquoise); }

/* --- cards / buttons --- */
.stack{ display:flex; flex-direction:column; gap:12px; }
input[type=text]{
  width:100%; padding:16px 14px; border-radius:8px; border:1px solid rgba(244,233,216,0.2);
  background:var(--denim-2); color:var(--cream); font-family:inherit; font-size:17px;
  outline:none;
}
input[type=text]:focus{ border-color:var(--turquoise); box-shadow:0 0 0 3px rgba(46,168,160,0.18); }
input[type=text]::placeholder{ color:rgba(244,233,216,0.35); }

button{ font-family:inherit; cursor:pointer; border:none; }
.btn{
  padding:17px 16px; border-radius:8px; font-size:16px; font-weight:600;
  background:var(--denim-2); color:var(--cream); border:1px solid rgba(244,233,216,0.14);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  transition:transform .08s ease, border-color .15s ease;
}
.btn:active{ transform:scale(0.98); }
.btn .arrow{ opacity:0.6; }
.btn.primary{ background:var(--turquoise); color:var(--denim-2); border-color:var(--turquoise); font-weight:700;}
.btn.cyan{ background:var(--orange); color:var(--denim-2); border-color:var(--orange); font-weight:700;}
.btn.ghost{ background:transparent; border:1px solid rgba(244,233,216,0.25); }
.btn.small{ padding:11px 14px; font-size:14px; }
.btn:disabled{ opacity:0.4; }

.profile-chip{
  display:flex; align-items:center; gap:12px; background:var(--denim-2); border:1px solid rgba(244,233,216,0.1);
  border-radius:12px; padding:14px 16px; margin-bottom:20px;
}
.profile-chip .avatar{ font-size:34px; line-height:1; }
.profile-chip .meta{ flex:1; }
.profile-chip .name{ font-weight:700; font-size:17px; font-family:'Oswald',sans-serif; letter-spacing:0.02em;}
.profile-chip .stats{ font-size:12px; opacity:0.7; margin-top:2px;}
.profile-chip .logout{ font-size:12px; opacity:0.6; text-decoration:underline; background:none; color:var(--cream);}

.error{ background:rgba(217,98,43,0.14); border:1px solid var(--orange); color:#ffd9bd; padding:10px 12px; border-radius:8px; font-size:14px; }

/* --- receipt / bar tab --- */
.receipt{
  background:var(--cream);
  color:var(--denim-2);
  border-radius:2px;
  position:relative;
  padding:22px 20px 20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.35);
}
.receipt::before, .receipt::after{
  content:"";
  position:absolute; left:0; right:0; height:9px;
  background:
    linear-gradient(135deg, var(--cream) 50%, transparent 50%) 0 0/10px 10px repeat-x,
    linear-gradient(-135deg, var(--cream) 50%, transparent 50%) 0 0/10px 10px repeat-x;
  background-color:var(--denim);
}
.receipt::before{ top:-9px; transform:rotate(180deg); }
.receipt::after{ bottom:-9px; }
.receipt .code-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
.receipt .code-label{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.6; font-family:'Oswald',sans-serif;}
.receipt .code-value{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; letter-spacing:0.06em;}
.dash{ border-top:2px dashed rgba(14,24,38,0.16); margin:12px 0; }
.gpd-hero{ text-align:center; padding:8px 0 14px; }
.badge-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin:4px 0 10px; }
.badge-ring{ width:126px; height:126px; border-radius:50%; border:3px double var(--orange); display:flex; align-items:center; justify-content:center; flex:none; background:rgba(217,98,43,0.06); }
.badge-ring .value{ font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:700; color:var(--denim-2); line-height:1;}
.badge-label{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.06em; font-size:15px; font-weight:700; color:var(--denim-2); line-height:1.3; text-align:left; }
.gpd-hero .sub{ font-size:12px; opacity:0.6; margin-top:2px;}
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin:6px 0 4px;}
.stat{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:14px; border-bottom:1px dotted rgba(14,24,38,0.18); padding-bottom:6px;}
.stat .k{ opacity:0.6; }
.stat .v{ font-weight:700; }
.receipt-footer{ text-align:center; font-size:11px; opacity:0.5; margin-top:14px; letter-spacing:0.08em;}

/* --- action grids in active tab --- */
.section-label{ font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--turquoise); margin:22px 0 10px; font-family:'Oswald',sans-serif; }
.section-label::before{ content:"★ "; color:var(--orange); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tier-btn{
  padding:14px 10px; border-radius:10px; text-align:left; background:var(--denim-2);
  border:1px solid rgba(244,233,216,0.1); color:var(--cream);
}
.tier-btn .pts{ font-family:'JetBrains Mono',monospace; font-size:12px; opacity:0.65; display:block; margin-top:2px;}
.tier-btn.chuckle{ border-left:4px solid var(--silver); }
.tier-btn.giggle{ border-left:4px solid var(--turquoise); }
.tier-btn.cackle{ border-left:4px solid #e08a52; }
.tier-btn.honkd{ border-left:4px solid var(--orange); }
.tier-btn.legendary{ border-left:4px solid var(--gold); grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;}
.drink-btn{ padding:18px 10px; border-radius:10px; background:var(--denim-2); border:1px solid rgba(244,233,216,0.1); color:var(--cream); font-weight:600; text-align:center;}
.drink-btn .units{ display:block; font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.6; margin-top:3px;}
.pop{ animation:pop .28s ease; }
@keyframes pop{ 0%{ transform:scale(1);} 40%{ transform:scale(1.04);} 100%{ transform:scale(1);} }

.ranking{ display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.rank-row{ display:flex; align-items:center; gap:10px; background:var(--denim-2); border-radius:10px; padding:10px 12px; border:1px solid rgba(244,233,216,0.08);}
.rank-row .pos{ font-family:'JetBrains Mono',monospace; opacity:0.55; width:18px;}
.rank-row .av{ font-size:20px; }
.rank-row .nm{ flex:1; font-weight:600; }
.rank-row .pt{ font-family:'JetBrains Mono',monospace; color:var(--gold); font-weight:700;}
.rank-row .pt-wrap{ display:flex; flex-direction:column; align-items:flex-end; }
.rank-row .gpd-mini{ font-size:10px; opacity:0.6; margin-top:1px; }
.rank-row.me{ border-color:var(--turquoise); }

.tabs{ display:flex; gap:8px; margin-bottom:16px; }
.tabs button{ flex:1; padding:10px; border-radius:8px; background:var(--denim-2); color:var(--cream); font-weight:600; opacity:0.6; border:1px solid transparent; font-family:'Oswald',sans-serif; letter-spacing:0.02em;}
.tabs button.active{ opacity:1; border-color:var(--turquoise); color:var(--turquoise); }

.lb-row{ display:flex; align-items:center; gap:12px; background:var(--denim-2); border-radius:10px; padding:12px 14px; margin-bottom:8px; border:1px solid rgba(244,233,216,0.08);}
.lb-row .rank{ font-family:'JetBrains Mono',monospace; opacity:0.5; width:22px;}
.lb-row .info{ flex:1; }
.lb-row .info .t1{ font-weight:700; }
.lb-row .info .t2{ font-size:12px; opacity:0.6; margin-top:2px;}
.lb-row .val{ font-family:'JetBrains Mono',monospace; color:var(--gold); font-weight:700; text-align:right;}
.lb-row .val small{ display:block; font-size:10px; opacity:0.6; color:var(--cream); font-weight:400;}

.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.back{ background:none; color:var(--cream); opacity:0.7; font-size:14px; display:flex; gap:6px; align-items:center;}
.hidden{ display:none !important; }
.empty{ text-align:center; opacity:0.55; padding:30px 10px; font-size:14px;}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--orange); color:var(--cream); font-weight:700; padding:10px 16px; border-radius:8px;
  font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,0.4); opacity:0; pointer-events:none; transition:opacity .2s ease, bottom .2s ease;
  z-index:50;
}
.toast.show{ opacity:1; bottom:34px; }
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="goose-full" viewBox="0 0 200 200">
      <path d="M100 108 Q94 58 152 53" fill="none" stroke="#16233a" stroke-width="34" stroke-linecap="round"/>
      <path d="M100 108 Q94 58 152 53" fill="none" stroke="#f4e9d8" stroke-width="27" stroke-linecap="round"/>
      <ellipse cx="93" cy="132" rx="56" ry="46" fill="#f4e9d8" stroke="#16233a" stroke-width="4"/>
      <path d="M60 115 Q78 100 96 118 Q84 138 62 132 Z" fill="#f4e9d8" stroke="#16233a" stroke-width="3"/>
      <path d="M66 116 Q78 112 88 122" fill="none" stroke="#16233a" stroke-width="1.5" opacity="0.5"/>
      <path d="M84 100 L124 100 L104 132 Z" fill="#2ea8a0" stroke="#16233a" stroke-width="3"/>
      <circle cx="104" cy="99" r="7" fill="#2ea8a0" stroke="#16233a" stroke-width="3"/>

      <ellipse cx="93" cy="140" rx="52" ry="42" fill="none" stroke="#16233a" stroke-width="4"/>

      <circle cx="153" cy="63" r="21" fill="none" stroke="#16233a" stroke-width="4"/>
      <path d="M173 59 L200 54 L178 69 Z" fill="none" stroke="#16233a" stroke-width="3.5"/>

      <text x="100" y="182" text-anchor="middle" font-family="Georgia,serif" font-size="13" letter-spacing="2" fill="#16233a">CERTIFIED SILLY</text>
    </symbol>
  </defs>
</svg>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API = '';
const state = { view:'landing', profile:null, room:null, error:null, pollTimer:null, lbTab:'nights', lbData:null, giggleTarget:null, myTabs:null, openTabs:null, tabDetail:null, tabDetailFrom:'home', pendingJoin:null };

const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(str){ return String(str == null ? '' : str).replace(/[&<>"']/g, c => ESC_MAP[c]); }

function saveName(n){ localStorage.setItem('gpd_name', n); }
function loadName(){ return localStorage.getItem('gpd_name') || ''; }
function saveRoom(code){ localStorage.setItem('gpd_room', code || ''); }
function loadRoom(){ return localStorage.getItem('gpd_room') || ''; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=> t.classList.remove('show'), 2200);
}

async function api(path, opts){
  const res = await fetch(API + path, {
    method: opts && opts.method || 'GET',
    headers: {'Content-Type':'application/json'},
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ throw new Error(data.error || 'Something went wrong'); }
  return data;
}

function stopPoll(){ if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer=null; } }

function go(view){
  state.view = view;
  state.error = null;
  render();
}

// ---------- boot ----------
async function boot(){
  const params = new URLSearchParams(location.search);
  const joinCode = params.get('join');
  if(joinCode){
    state.pendingJoin = joinCode.trim().toUpperCase();
    history.replaceState({}, '', location.pathname);
  }

  const name = loadName();
  if(name){
    try{
      state.profile = await api('/api/profile', {method:'POST', body:{name}});

      if(state.pendingJoin){
        const code = state.pendingJoin;
        state.pendingJoin = null;
        try{
          const r = await api('/api/rooms/'+code+'/join', {method:'POST', body:{name}});
          state.room = r;
          saveRoom(r.code);
          go('tab');
          startPolling();
          return;
        }catch(e){ toast(e.message); }
      }

      const room = loadRoom();
      if(room){
        try{
          const r = await api('/api/rooms/' + room);
          if(r.status === 'active'){
            state.room = r;
            await api('/api/rooms/'+room+'/join', {method:'POST', body:{name}});
            go('tab');
            startPolling();
            return;
          } else { saveRoom(''); }
        }catch(e){ saveRoom(''); }
      }
      go('home');
      return;
    }catch(e){ /* fall through to landing */ }
  }
  go('landing');
}

function startPolling(){
  stopPoll();
  state.pollTimer = setInterval(async ()=>{
    if(state.view === 'tab' && state.room){
      try{
        const r = await api('/api/rooms/' + state.room.code);
        state.room = r;
        if(r.status !== 'active'){
          stopPoll();
          saveRoom('');
          toast('This tab was closed by the owner');
          go('home');
          return;
        }
        renderTabLive();
      }catch(e){ /* room may have vanished; ignore transient errors */ }
    }
  }, 3000);
}

// ---------- render root ----------
function render(){
  const app = document.getElementById('app');
  if(state.view === 'landing') app.innerHTML = viewLanding();
  else if(state.view === 'home') app.innerHTML = viewHome();
  else if(state.view === 'join') app.innerHTML = viewJoin();
  else if(state.view === 'tab') app.innerHTML = viewTab();
  else if(state.view === 'leaderboard') app.innerHTML = viewLeaderboard();
  else if(state.view === 'myTabs') app.innerHTML = viewMyTabs();
  else if(state.view === 'tabDetail') app.innerHTML = viewTabDetail();
  bindEvents();
}

// ---------- LANDING ----------
function viewLanding(){
  return `
  <div class="center-flex">
    <div class="brand">
      <div class="mascot-perch"><svg class="goose-lg"><use href="#goose-full"/></svg></div>
      <h1 class="title-block">HONK'D</h1>
      <p>tonight's tab, tallied live</p>
    </div>
    <div class="stack">
      <input type="text" id="nameInput" placeholder="What's your name?" maxlength="24" autocomplete="off" />
      ${state.error ? `<div class="error">${state.error}</div>` : ''}
      <button class="btn primary" id="enterBtn">Pull up a stool <span class="arrow">→</span></button>
    </div>
  </div>`;
}

// ---------- HOME ----------
function viewHome(){
  const p = state.profile;
  return `
  <div>
    <div class="profile-chip">
      <div class="avatar">${p.avatar}</div>
      <div class="meta">
        <div class="name">${esc(p.name)}</div>
        <div class="stats mono">${Math.round(p.lifetime_points*10)/10} lifetime pts · ${p.nights_played} nights</div>
      </div>
      <button class="logout" id="logoutBtn">switch</button>
    </div>
    <div class="stack">
      <button class="btn primary" id="startBtn">Start a tab <span class="arrow">→</span></button>
      <button class="btn cyan" id="joinBtn">Join a tab <span class="arrow">→</span></button>
      <button class="btn ghost" id="myTabsBtn">My tabs <span class="arrow">→</span></button>
      <button class="btn ghost" id="lbBtn">Leaderboard <span class="arrow">→</span></button>
    </div>
    ${state.error ? `<div class="error" style="margin-top:12px;">${state.error}</div>` : ''}
  </div>`;
}

// ---------- JOIN ----------
function viewJoin(){
  return `
  <div>
    <div class="topbar">
      <button class="back" id="backBtn">← back</button>
    </div>
    <div class="brand" style="margin-bottom:26px;">
      <h1 class="title-block" style="font-size:26px;">Join a Tab</h1>
    </div>
    <div class="stack">
      <input type="text" id="codeInput" placeholder="Room code (e.g. 7XQK)" maxlength="4" autocomplete="off" style="text-transform:uppercase; letter-spacing:0.1em; text-align:center; font-family:'JetBrains Mono',monospace; font-size:22px;" />
      ${state.error ? `<div class="error">${state.error}</div>` : ''}
      <button class="btn cyan" id="joinSubmit">Join tab <span class="arrow">→</span></button>
    </div>
  </div>`;
}

// ---------- ACTIVE TAB ----------
function isOwner(){ return state.room && state.profile && state.room.owner === state.profile.name; }

function tierBtn(key,label,pts,cls,target){
  return `<button class="tier-btn ${cls}" data-giggle="${key}" ${target ? `data-target="${esc(target)}"` : ''}><span>${label}</span><span class="pts">${pts} pt${pts===1?'':'s'}</span></button>`;
}

function viewTab(){
  const r = state.room;
  const owner = isOwner();
  return `
  <div>
    <div class="topbar">
      <button class="back" id="leaveBtn">← leave tab</button>
      ${owner ? `<button class="btn small ghost" id="closeBtn">Close out</button>` : `<span></span>`}
    </div>

    <div class="receipt" id="receipt">
      <div class="code-row">
        <span class="code-label">Tab #${r.code}</span>
        <span class="code-value">${owner ? '👑 you' : '🍸 friend'}</span>
      </div>
      <div class="dash"></div>
      <div class="gpd-hero">
        <div class="badge-row">
          <div class="badge-ring"><div class="value mono" id="gpdVal">${r.gpd.toFixed(2)}</div></div>
          <div class="badge-label">Giggles<br/>per drink</div>
        </div>
        <div class="sub">hosted by ${esc(r.owner)}</div>
      </div>
      <div class="dash"></div>
      <div class="stat-grid mono">
        <div class="stat"><span class="k">Giggle Score</span><span class="v" id="statGiggle">${r.giggle_score.toFixed(1)}</span></div>
        <div class="stat"><span class="k">Drink Units</span><span class="v" id="statDrinks">${r.drink_units.toFixed(1)}</span></div>
        <div class="stat"><span class="k">Shots Taken</span><span class="v" id="statShots">${r.shots}</span></div>
        <div class="stat"><span class="k">Giggles / Hr</span><span class="v" id="statPerHour">${r.giggles_per_hour}</span></div>
      </div>
      <div class="receipt-footer">thanks for coming out ♥ keep it classy</div>
    </div>

    <div class="section-label">Log your own drink</div>
    <div class="grid2">
      <button class="drink-btn" data-drink="beer">🍺 Beer<span class="units">1.0 unit</span></button>
      <button class="drink-btn" data-drink="wine">🍷 Wine<span class="units">1.0 unit</span></button>
      <button class="drink-btn" data-drink="cocktail">🍹 Cocktail<span class="units">1.5 units</span></button>
      <button class="drink-btn" data-drink="shot">🥃 Shot<span class="units">1.0 unit</span></button>
    </div>

    <div class="section-label">In this tab — tap a friend to rate their giggle</div>
    <div class="ranking" id="ranking">${renderRanking(r)}</div>

    <div class="section-label">Scan to join</div>
    <div class="qr-wrap" id="qrWrap"></div>
    <div class="qr-caption mono">or enter code <b>${r.code}</b></div>
  </div>`;
}

function renderJoinQR(code){
  const wrap = document.getElementById('qrWrap');
  if(!wrap || typeof qrcode === 'undefined') return;
  const url = location.origin + location.pathname + '?join=' + code;
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  wrap.innerHTML = qr.createSvgTag({ scalable: true });
  const svg = wrap.querySelector('svg');
  if(svg){ svg.removeAttribute('width'); svg.removeAttribute('height'); svg.style.width = '100%'; svg.style.height = '100%'; }
}

function renderRanking(r){
  if(r.participants.length <= 1) return `<div class="empty"><div class="mascot-perch"><svg class="goose-sm"><use href="#goose-full"/></svg></div>No friends have joined yet — share code <b>${r.code}</b></div>`;
  const me = state.profile && state.profile.name;
  return r.participants.map((p,i)=>{
    const isMe = p.name === me;
    const open = state.giggleTarget === p.name;
    const row = `
    <div class="rank-row ${isMe?'me':''}" ${!isMe ? `data-rate-target="${esc(p.name)}" style="cursor:pointer;"` : ''}>
      <span class="pos mono">${i+1}</span>
      <span class="av">${p.avatar}</span>
      <span class="nm">${esc(p.name)}${isMe?' (you)':''}</span>
      <span class="pt-wrap">
        <span class="pt mono">${p.points.toFixed(1)} pts</span>
        <span class="gpd-mini mono">${p.gpd.toFixed(2)} gpd</span>
      </span>
    </div>`;
    const picker = open ? `
    <div class="grid2 giggle-picker">
      ${tierBtn('chuckle','😤 Chuckle','0.5','chuckle',p.name)}
      ${tierBtn('giggle','😄 Giggle','1','giggle',p.name)}
      ${tierBtn('cackle','😆 Cackle','2','cackle',p.name)}
      ${tierBtn('honkd',"🪿 HONK'D",'3','honkd',p.name)}
      ${tierBtn('legendary','🏆 Legendary','5','legendary',p.name)}
    </div>` : '';
    return row + picker;
  }).join('');
}

function bindRankingEvents(){
  const ranking = document.getElementById('ranking');
  if(!ranking) return;
  ranking.querySelectorAll('[data-rate-target]').forEach(row=>{
    row.onclick = ()=>{
      const name = row.dataset.rateTarget;
      state.giggleTarget = state.giggleTarget === name ? null : name;
      ranking.innerHTML = renderRanking(state.room);
      bindRankingEvents();
    };
  });
  ranking.querySelectorAll('[data-giggle]').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      btn.classList.add('pop');
      setTimeout(()=>btn.classList.remove('pop'), 280);
      const target = btn.dataset.target;
      try{
        const r = await api('/api/rooms/'+state.room.code+'/giggle', {method:'POST', body:{name: state.profile.name, tier: btn.dataset.giggle, target}});
        state.room = r;
        state.giggleTarget = null;
        ranking.innerHTML = renderRanking(state.room);
        bindRankingEvents();
        toast('🎉 rated ' + target);
      }catch(e){ toast(e.message); }
    };
  });
}

function renderTabLive(){
  if(state.view !== 'tab') return;
  const r = state.room;
  const gpdEl = document.getElementById('gpdVal');
  if(!gpdEl) return; // view changed under us
  gpdEl.textContent = r.gpd.toFixed(2);
  document.getElementById('statGiggle').textContent = r.giggle_score.toFixed(1);
  document.getElementById('statDrinks').textContent = r.drink_units.toFixed(1);
  document.getElementById('statShots').textContent = r.shots;
  document.getElementById('statPerHour').textContent = r.giggles_per_hour;
  document.getElementById('ranking').innerHTML = renderRanking(r);
  bindRankingEvents();
}

// ---------- LEADERBOARD ----------
function viewLeaderboard(){
  return `
  <div>
    <div class="topbar">
      <button class="back" id="backBtn">← back</button>
    </div>
    <div class="brand" style="margin-bottom:18px;">
      <h1 class="title-block" style="font-size:26px;">Leaderboard</h1>
    </div>
    <div class="tabs">
      <button data-lb="nights" class="${state.lbTab==='nights'?'active':''}">Best Nights</button>
      <button data-lb="friends" class="${state.lbTab==='friends'?'active':''}">Funniest Friends</button>
    </div>
    <div id="lbList">${renderLbList()}</div>
  </div>`;
}

function renderLbList(){
  const data = state.lbData;
  if(!data) return `<div class="empty">Loading…</div>`;
  if(state.lbTab === 'nights'){
    if(!data.nights.length) return `<div class="empty">No nights closed out yet. Be the first!</div>`;
    return data.nights.map((n,i)=>`
      <div class="lb-row" data-open-tab="${n.room_code}" style="cursor:pointer;">
        <span class="rank mono">${i+1}</span>
        <div class="info">
          <div class="t1">${esc(n.owner)}'s tab</div>
          <div class="t2">${new Date(n.date).toLocaleDateString()} · MVP ${n.mvp ? esc(n.mvp) : '—'}</div>
        </div>
        <div class="val">${n.gpd.toFixed(2)}<small>GPD</small></div>
      </div>`).join('');
  } else {
    if(!data.friends.length) return `<div class="empty">No profiles yet.</div>`;
    return data.friends.map((f,i)=>`
      <div class="lb-row">
        <span class="rank mono">${i+1}</span>
        <div class="info">
          <div class="t1">${f.avatar} ${esc(f.name)}</div>
          <div class="t2">${f.nights_played} nights · best ${f.best_night.toFixed(1)} pts</div>
        </div>
        <div class="val">${f.lifetime_points.toFixed(1)}<small>pts</small></div>
      </div>`).join('');
  }
}

async function loadLeaderboard(){
  try{
    const [nights, friends] = await Promise.all([
      api('/api/leaderboard/nights'),
      api('/api/leaderboard/friends')
    ]);
    state.lbData = {nights, friends};
    document.getElementById('lbList').innerHTML = renderLbList();
    bindOpenTabHandlers();
  }catch(e){ /* ignore */ }
}

// ---------- MY TABS ----------
function viewMyTabs(){
  return `
  <div>
    <div class="topbar">
      <button class="back" id="backBtn">← back</button>
    </div>
    <div class="brand" style="margin-bottom:18px;">
      <h1 class="title-block" style="font-size:26px;">My Tabs</h1>
    </div>
    <div class="section-label">Open right now</div>
    <div id="openTabsList">${renderOpenTabsList()}</div>
    <div class="section-label">Past tabs</div>
    <div id="myTabsList">${renderMyTabsList()}</div>
  </div>`;
}

function renderOpenTabsList(){
  const rows = state.openTabs;
  if(!rows) return `<div class="empty">Loading…</div>`;
  if(!rows.length) return `<div class="empty">No open tabs right now.</div>`;
  const me = state.profile && state.profile.name;
  return rows.map(r=>`
    <div class="lb-row" data-rejoin-tab="${esc(r.code)}" style="cursor:pointer;">
      <span class="rank mono">🟢</span>
      <div class="info">
        <div class="t1">Tab #${esc(r.code)}${r.owner===me?' · you\'re hosting':''}</div>
        <div class="t2">hosted by ${esc(r.owner)}</div>
      </div>
      <div class="val" style="color:var(--turquoise); font-family:'Oswald',sans-serif; font-size:13px;">JOIN →</div>
    </div>`).join('');
}

function bindRejoinHandlers(){
  document.querySelectorAll('[data-rejoin-tab]').forEach(row=>{
    row.onclick = async ()=>{
      const code = row.dataset.rejoinTab;
      try{
        const r = await api('/api/rooms/'+code+'/join', {method:'POST', body:{name: state.profile.name}});
        state.room = r;
        saveRoom(r.code);
        go('tab');
        startPolling();
      }catch(e){ toast(e.message); }
    };
  });
}

async function loadOpenTabs(){
  try{
    const rows = await api('/api/profile/'+encodeURIComponent(state.profile.name)+'/open-tabs');
    state.openTabs = rows;
    const el = document.getElementById('openTabsList');
    if(el) el.innerHTML = renderOpenTabsList();
    bindRejoinHandlers();
  }catch(e){ /* ignore */ }
}

function renderMyTabsList(){
  const rows = state.myTabs;
  if(!rows) return `<div class="empty">Loading…</div>`;
  if(!rows.length) return `<div class="empty">No tabs closed out yet. Start one and close it out to see it here.</div>`;
  const me = state.profile && state.profile.name;
  return rows.map(n=>`
    <div class="lb-row" data-open-tab="${n.room_code}" style="cursor:pointer;">
      <span class="rank mono">${n.owner === me ? '👑' : '🍸'}</span>
      <div class="info">
        <div class="t1">Tab #${n.room_code}${n.owner===me?' · you hosted':''}</div>
        <div class="t2">${new Date(n.date).toLocaleDateString()} · MVP ${n.mvp ? esc(n.mvp) : '—'}${n.my_points!=null?` · you scored ${n.my_points.toFixed(1)} pts`:''}</div>
      </div>
      <div class="val">${n.gpd.toFixed(2)}<small>GPD</small></div>
    </div>`).join('');
}

async function loadMyTabs(){
  try{
    const rows = await api('/api/profile/'+encodeURIComponent(state.profile.name)+'/tabs');
    state.myTabs = rows;
    const el = document.getElementById('myTabsList');
    if(el) el.innerHTML = renderMyTabsList();
    bindOpenTabHandlers();
  }catch(e){ /* ignore */ }
}

// ---------- TAB DETAIL (read-only) ----------
function viewTabDetail(){
  const r = state.tabDetail;
  if(!r){
    return `
    <div>
      <div class="topbar"><button class="back" id="backBtn">← back</button></div>
      <div class="empty">Loading…</div>
    </div>`;
  }
  return `
  <div>
    <div class="topbar">
      <button class="back" id="backBtn">← back</button>
    </div>
    <div class="receipt">
      ${r.status !== 'active' ? `<div class="stamp"><svg width="100%" height="100%"><use href="#goose-stamp"/></svg></div>` : ''}
      <div class="code-row">
        <span class="code-label">Tab #${r.code}</span>
        <span class="code-value">${r.status === 'active' ? '🟢 live' : '✅ closed'}</span>
      </div>
      <div class="dash"></div>
      <div class="gpd-hero">
        <div class="badge-row">
          <div class="badge-ring"><div class="value mono">${r.gpd.toFixed(2)}</div></div>
          <div class="badge-label">Giggles<br/>per drink</div>
        </div>
        <div class="sub">hosted by ${esc(r.owner)}</div>
      </div>
      <div class="dash"></div>
      <div class="stat-grid mono">
        <div class="stat"><span class="k">Giggle Score</span><span class="v">${r.giggle_score.toFixed(1)}</span></div>
        <div class="stat"><span class="k">Drink Units</span><span class="v">${r.drink_units.toFixed(1)}</span></div>
        <div class="stat"><span class="k">Shots Taken</span><span class="v">${r.shots}</span></div>
        <div class="stat"><span class="k">Giggles / Hr</span><span class="v">${r.giggles_per_hour}</span></div>
      </div>
      <div class="receipt-footer">${new Date(r.created_at).toLocaleDateString()} · thanks for coming out ♥</div>
    </div>
    <div class="section-label">Final standings</div>
    <div class="ranking">${r.participants.length ? r.participants.map((p,i)=>`
      <div class="rank-row ${state.profile && p.name===state.profile.name ? 'me':''}">
        <span class="pos mono">${i+1}</span>
        <span class="av">${p.avatar}</span>
        <span class="nm">${esc(p.name)}</span>
        <span class="pt-wrap">
          <span class="pt mono">${p.points.toFixed(1)} pts</span>
          <span class="gpd-mini mono">${p.gpd.toFixed(2)} gpd</span>
        </span>
      </div>`).join('') : `<div class="empty">No one joined this tab.</div>`}</div>
  </div>`;
}

function bindOpenTabHandlers(){
  document.querySelectorAll('[data-open-tab]').forEach(row=>{
    row.onclick = ()=> openTabDetail(row.dataset.openTab, state.view);
  });
}

async function openTabDetail(code, from){
  state.tabDetailFrom = from;
  state.tabDetail = null;
  go('tabDetail');
  try{
    state.tabDetail = await api('/api/rooms/' + code);
    if(state.view === 'tabDetail') render();
  }catch(e){
    toast(e.message);
    go(from);
  }
}

// ---------- events ----------
function bindEvents(){
  const app = document.getElementById('app');

  if(state.view === 'landing'){
    document.getElementById('enterBtn').onclick = async ()=>{
      const val = document.getElementById('nameInput').value.trim();
      if(!val){ state.error='Enter a name to continue'; render(); return; }
      try{
        state.profile = await api('/api/profile', {method:'POST', body:{name:val}});
        saveName(val);
        if(state.pendingJoin){
          const code = state.pendingJoin;
          state.pendingJoin = null;
          try{
            const r = await api('/api/rooms/'+code+'/join', {method:'POST', body:{name:val}});
            state.room = r;
            saveRoom(r.code);
            go('tab');
            startPolling();
            return;
          }catch(e){ toast(e.message); }
        }
        go('home');
      }catch(e){ state.error = e.message; render(); }
    };
    document.getElementById('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('enterBtn').click(); });
  }

  if(state.view === 'home'){
    document.getElementById('startBtn').onclick = async ()=>{
      try{
        const r = await api('/api/rooms', {method:'POST', body:{owner: state.profile.name}});
        state.room = r;
        saveRoom(r.code);
        go('tab');
        startPolling();
      }catch(e){ state.error = e.message; render(); }
    };
    document.getElementById('joinBtn').onclick = ()=> go('join');
    document.getElementById('myTabsBtn').onclick = ()=>{ state.myTabs = null; state.openTabs = null; go('myTabs'); loadMyTabs(); loadOpenTabs(); };
    document.getElementById('lbBtn').onclick = ()=>{ go('leaderboard'); loadLeaderboard(); };
    document.getElementById('logoutBtn').onclick = ()=>{
      localStorage.removeItem('gpd_name');
      state.profile = null;
      go('landing');
    };
  }

  if(state.view === 'join'){
    document.getElementById('backBtn').onclick = ()=> go('home');
    document.getElementById('joinSubmit').onclick = async ()=>{
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      if(!code){ state.error='Enter a room code'; render(); return; }
      try{
        const r = await api('/api/rooms/'+code+'/join', {method:'POST', body:{name: state.profile.name}});
        state.room = r;
        saveRoom(r.code);
        go('tab');
        startPolling();
      }catch(e){ state.error = e.message; render(); }
    };
    document.getElementById('codeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('joinSubmit').click(); });
  }

  if(state.view === 'tab'){
    document.getElementById('leaveBtn').onclick = ()=>{
      stopPoll();
      saveRoom('');
      state.giggleTarget = null;
      go('home');
    };
    const closeBtn = document.getElementById('closeBtn');
    if(closeBtn){
      closeBtn.onclick = async ()=>{
        if(!confirm('Close out this tab for everyone? This finalizes the night.')) return;
        try{
          const r = await api('/api/rooms/'+state.room.code+'/close', {method:'POST', body:{name: state.profile.name}});
          stopPoll();
          saveRoom('');
          state.giggleTarget = null;
          toast('Tab closed — GPD ' + r.gpd.toFixed(2));
          // refresh profile stats
          state.profile = await api('/api/profile', {method:'POST', body:{name: state.profile.name}});
          go('home');
        }catch(e){ toast(e.message); }
      };
    }
    app.querySelectorAll('[data-drink]').forEach(btn=>{
      btn.onclick = async ()=>{
        btn.classList.add('pop');
        setTimeout(()=>btn.classList.remove('pop'), 280);
        try{
          const r = await api('/api/rooms/'+state.room.code+'/drink', {method:'POST', body:{name: state.profile.name, type: btn.dataset.drink}});
          state.room = r;
          renderTabLive();
        }catch(e){ toast(e.message); }
      };
    });
    bindRankingEvents();
    renderJoinQR(state.room.code);
  }

  if(state.view === 'leaderboard'){
    document.getElementById('backBtn').onclick = ()=> go('home');
    app.querySelectorAll('[data-lb]').forEach(btn=>{
      btn.onclick = ()=>{
        state.lbTab = btn.dataset.lb;
        render();
      };
    });
    bindOpenTabHandlers();
  }

  if(state.view === 'myTabs'){
    document.getElementById('backBtn').onclick = ()=> go('home');
    bindOpenTabHandlers();
    bindRejoinHandlers();
  }

  if(state.view === 'tabDetail'){
    document.getElementById('backBtn').onclick = ()=> go(state.tabDetailFrom);
  }
}

boot();
</script>
</body>
</html>
